services:
  agent-worker:
    image: python:3.11-slim
    command: ["python", "-m", "src.cli.main", "status"]
    environment:
      AO_RUNTIME_MODE: worker
    volumes:
      - ..:/workspace:ro
    working_dir: /workspace

  metrics-sidecar:
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /tmp/ao-metrics /run/ao && sleep 3600"]
    labels:
      ao.role: sidecar
      ao.writable-paths: /tmp/ao-metrics,/run/ao
    read_only: true
    tmpfs:
      - /tmp/ao-metrics:rw,noexec,nosuid,size=16m
      - /run/ao:rw,noexec,nosuid,size=4m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  log-forwarder-sidecar:
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /tmp/ao-logs /run/ao && sleep 3600"]
    labels:
      ao.role: sidecar
      ao.writable-paths: /tmp/ao-logs,/run/ao
    read_only: true
    tmpfs:
      - /tmp/ao-logs:rw,noexec,nosuid,size=16m
      - /run/ao:rw,noexec,nosuid,size=4m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
